# Pulse Maze static hosting example.
# Replace server_name and root with values from your hosting provider.
server {
  listen 80;
  listen [::]:80;
  server_name pulse-maze.example.com;

  root /var/www/pulse-maze/dist;
  index index.html;

  charset utf-8;

  location = / {
    try_files /index.html =404;
  }

  location = /en {
    try_files /en/index.html =404;
  }

  location = /en/ {
    try_files /en/index.html =404;
  }

  # The game is a client-side route. There is no dist/game/index.html by design.
  location = /game {
    try_files /index.html =404;
  }

  location = /game/ {
    try_files /index.html =404;
  }

  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
